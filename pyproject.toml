[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "manimagent"
version = "0.3.0"
description = "Traceable answers and chunked silent teaching animations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=3,<5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.34,<1",
  "mdit-py-plugins>=0.4,<1",
]

[project.optional-dependencies]
animation = ["manim==0.20.1", "av==15.1.0", "matplotlib>=3.9,<4", "imageio-ffmpeg==0.6.0", "psutil>=6,<8"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5", "pillow>=11,<13", "httpx2>=2.13,<3"]

[project.scripts]
manimagent = "manimagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manimagent"]

[tool.hatch.build.targets.sdist]
only-include = ["src/manimagent", "tests", "scripts", "docs", "README.md", "pyproject.toml", "uv.lock", "config.example.yaml", ".env.example"]

[tool.hatch.build]
exclude = ["/legacy_mvp", "/testmaterial", "/testresult", "/runs", "/config.yaml", "/.env", "/.venv-before-separation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
