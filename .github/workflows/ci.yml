name: PR validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  current:
    name: Current (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Python lint and format
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run --no-sync ruff check src tests scripts evals
          uv run --no-sync ruff format --check src tests scripts evals
      - name: JavaScript syntax
        if: matrix.os == 'ubuntu-latest'
        run: |
          for file in src/manimagent/web/*.js; do node --check "$file"; done
          node --test tests/web/*.test.mjs
      - name: Current regression tests
        run: uv run --no-sync python -m pytest -q --junitxml=testresult/ci/current.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: testresult/ci/current.xml
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native animation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install renderer system libraries and Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config fonts-noto-cjk
      - name: Install locked animation dependencies
        run: uv sync --locked --extra dev --extra animation
      - name: Render and fully decode silent and narrated animation
        env:
          RUN_NATIVE_TESTS: "1"
        run: |
          mkdir -p testresult/ci
          uv run --no-sync python -m pytest -q tests/native --basetemp=testresult/ci/native --junitxml=testresult/ci/native.xml
      - name: Save render evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-animation
          path: |
            testresult/ci/native.xml
            testresult/ci/native/**/result.json
            testresult/ci/native/**/frame_*.png
            testresult/ci/native/**/complete.mp4
            testresult/ci/native/**/error.txt
          retention-days: 7

  package:
    name: Installable package
    needs: current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check dependency lock
        run: uv lock --check
      - name: Build current distributions
        run: uv build --out-dir dist/current
      - name: Check archive isolation and run installed applications
        run: uv run --no-project --python 3.12 python scripts/check_distribution.py dist/current
      - name: Save verified packages for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-distributions
          path: |
            dist/current/*.whl
            dist/current/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  required:
    name: PR checks
    if: always()
    needs: [current, native, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success,success" ]]; then
            printf 'Validation jobs did not all succeed: %s\n' "$RESULTS"
            exit 1
          fi
