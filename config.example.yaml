runs_dir: runs/current
private_dir: runs/current/private
max_upload_bytes: 20971520
max_parse_pages: 100
max_parse_chars: 200000
max_archive_bytes: 52428800
max_archive_entries: 2000
parse_timeout: 60
answer_context_tokens: 24000
answer_check: true
task_timeout: 900
model_timeout: 90
max_model_calls: 12
max_total_tokens: 200000
max_waiting: 3
models:
  text:
    base_url: ${MANIMAGENT_TEXT_BASE_URL}
    model: ${MANIMAGENT_TEXT_MODEL}
    api_key_env: MANIMAGENT_TEXT_API_KEY
    json_mode: true
    token_parameter: max_tokens
    max_output_tokens: 6000
    context_window: 32000
roles:
  answer_writer: text
  answer_checker: text
