runs_dir: runs/current
private_dir: runs/current/private
max_upload_bytes: 20971520
max_parse_pages: 100
max_visual_pages: 12  # Total images/scanned pages per task; requires a visual material_reader.
max_parse_chars: 200000
max_archive_bytes: 52428800
max_archive_entries: 2000
parse_timeout: 60
answer_context_tokens: 24000
answer_check: true
task_timeout: 900
model_timeout: 90
max_model_calls: 30
max_total_tokens: 300000
max_waiting: 3
memory_learning_timeout: 20  # Background learning only; at most one call per attempt.
memory_learning_max_tokens: 16000  # Separate from foreground max_total_tokens.
memory_policy:
  promotion_sessions: 3
  short_term_days: 14
  max_entries: 200
  max_snapshot_entries: 12
  max_snapshot_chars: 6000
  max_evidence_per_entry: 20
  max_sources: 10000
video_timeout: 600
video_render_timeout: 90
video_queue_timeout: 120
video_max_model_calls: 24
video_max_output_tokens: 10000
video_context_tokens: 96000
video_font: auto
video_memory_mb: 2048
tts:
  enabled: false  # Or set MANIMAGENT_TTS_ENABLED=true in the local .env file.
  base_url: https://api.xiaomimimo.com/v1
  model: mimo-v2.5-tts
  api_key_env: MIMO_API_KEY
  voice: mimo_default
  timeout: 60
  max_calls: 64
  max_retries: 1
models:
  text:
    base_url: ${MANIMAGENT_TEXT_BASE_URL}
    model: ${MANIMAGENT_TEXT_MODEL}
    api_key_env: MANIMAGENT_TEXT_API_KEY
    json_mode: true
    token_parameter: max_tokens
    max_output_tokens: 6000
    context_window: 128000
    thinking: default  # DeepSeek supports disabled; enable this only after verifying the service.
    supports_vision: false  # Enable only for a model supporting Chat Completions image_url.
roles:
  answer_writer: text
  answer_checker: text
  video_planner: text
  scene_generator: text
  plan_checker: text
  # material_reader: vision  # Optional model ID; omitted means follow answer_writer.
